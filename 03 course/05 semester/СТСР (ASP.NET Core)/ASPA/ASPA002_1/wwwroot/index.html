<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Neumann</title>
    <link rel="stylesheet" href="css/index.css" />
    <script src="js/calc.js"></script>
</head>
<body>
    <h1>Calc</h1>
    <p> Sum(7, 3) =  <span id="sum" class="red">        </span> </p>
    <p> Sub(7, 3) =  <span id="sub" class="green">      </span> </p>
    <p> Mul(7, 3) =  <span id="mul" class="magenta">    </span> </p>
    <p> Div(7, 3) =  <span id="div" class="blue">       </span> </p>
    <script>
        sum.innerText = Sum(7, 3);
        sub.innerText = Sub(7, 3);
        mul.innerText = Mul(7, 3);
        div.innerText = Div(7, 3).toFixed(2);
    </script>
    <img src="jpg/Neumann.jpg" />
</body>
</html>
